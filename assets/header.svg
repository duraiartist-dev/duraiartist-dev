<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1c2230"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c79a3b"/><stop offset="1" stop-color="#f2d58a"/></linearGradient>
</defs>
<rect width="1000" height="240" rx="14" fill="url(#bg)"/>
<g font-family="Consolas,Menlo,monospace" fill="#c79a3b" opacity="0.28" font-size="34">
<text x="70" y="70">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/></text>
<text x="860" y="90">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="6s" repeatCount="indefinite"/></text>
<text x="150" y="200">&lt;div&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="7s" repeatCount="indefinite"/></text>
<text x="780" y="205">( )=&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="5.5s" repeatCount="indefinite"/></text>
<text x="500" y="40" font-size="24">#<animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="4.5s" repeatCount="indefinite"/></text>
</g>
<text x="500" y="112" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="url(#gold)" letter-spacing="6">DURAI
<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0,24;0,0" dur="1.2s" fill="freeze"/></text>
<rect x="400" y="132" height="3" rx="1.5" fill="#c79a3b"><animate attributeName="width" values="0;200" dur="1.4s" begin="0.6s" fill="freeze"/></rect>
<text x="500" y="178" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#e6edf3" letter-spacing="3">WEB DEVELOPER FOR LOCAL BUSINESSES
<animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/></text>
<text x="500" y="208" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e" letter-spacing="2">Madurai, Tamil Nadu, India
<animate attributeName="opacity" values="0;1" dur="1s" begin="1.8s" fill="freeze"/></text>
</svg>