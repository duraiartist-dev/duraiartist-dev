<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1b1440"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#f2c14e"><animate attributeName="stop-color" values="#f2c14e;#2dd4bf;#ff6b9d;#a78bfa;#f2c14e" dur="8s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#2dd4bf"><animate attributeName="stop-color" values="#2dd4bf;#ff6b9d;#a78bfa;#f2c14e;#2dd4bf" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<rect width="800" height="300" rx="18" fill="url(#bg)"/>
<g font-family="Consolas,Menlo,monospace" font-size="36" opacity="0.5">
<text x="50" y="80" fill="#2dd4bf">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/></text>
<text x="690" y="100" fill="#ff6b9d">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="6s" repeatCount="indefinite"/></text>
<text x="60" y="270" fill="#a78bfa">&lt;div&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="7s" repeatCount="indefinite"/></text>
<text x="640" y="270" fill="#f2c14e">( )=&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,10;0,0" dur="5.5s" repeatCount="indefinite"/></text>
</g>
<text x="400" y="130" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="88" font-weight="700" fill="url(#t)" letter-spacing="6">DURAI
<animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" values="0,24;0,0" dur="1.2s" fill="freeze"/></text>
<rect x="300" y="152" height="4" rx="2" fill="url(#t)"><animate attributeName="width" values="0;200" dur="1.4s" begin="0.6s" fill="freeze"/></rect>
<text x="400" y="203" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="32" font-weight="600" fill="#ffffff" letter-spacing="3">WEB DEVELOPER
<animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/></text>
<text x="400" y="240" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#c4b5fd" letter-spacing="2">for Local Businesses
<animate attributeName="opacity" values="0;1" dur="1s" begin="1.6s" fill="freeze"/></text>
<text x="400" y="272" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#94a3b8" letter-spacing="1">Madurai, Tamil Nadu, India
<animate attributeName="opacity" values="0;1" dur="1s" begin="2s" fill="freeze"/></text>
</svg>